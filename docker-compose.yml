services:
  db:
    image: postgres:16-alpine
    container_name: todo_app_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo_dev_password
      POSTGRES_DB: todo_app
    ports:
      - "5433:5432"
    volumes:
      - todo_app_pgdata:/var/lib/postgresql/data

volumes:
  todo_app_pgdata:
